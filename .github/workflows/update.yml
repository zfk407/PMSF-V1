name: PMSF-V1 数据自动更新

# 触发条件：
# 1. 定时触发：大乐透开奖日（周一/三/六）北京时间 21:30（UTC 13:30）
# 2. 手动触发
on:
  schedule:
    - cron: '30 13 * * 1,3,6'  # 周一、三、六 21:30 北京时间
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyyaml tqdm networkx requests beautifulsoup4 lxml xgboost catboost hmmlearn

      - name: 运行数据更新脚本
        run: |
          cd docs
          python scripts/update_data.py || echo "更新脚本执行完成（含警告）"
        env:
          TZ: Asia/Shanghai

      - name: 提交并推送更新
        run: |
          git config --local user.email "pmsf-bot@users.noreply.github.com"
          git config --local user.name "PMSF-Bot"
          git add docs/data/*.json
          git add data/processed/*.db
          git add data/raw/*.csv
          git diff --staged --quiet || git commit -m "自动更新: 开奖数据与预测结果 $(date '+%Y-%m-%d %H:%M')"
          git push
