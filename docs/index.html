<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZHIHUI-DLT 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #0a0e1a;
      color: #e8ecf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(circle at 20% 30%, rgba(59,130,246,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(139,92,246,0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(6,182,212,0.06) 0%, transparent 60%);
      animation: bgFloat 20s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-2%, -2%) rotate(1deg); }
    }
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
      background: rgba(26, 34, 54, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid #2a3654;
      border-radius: 16px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.5);
      animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 28px;
      color: white;
      box-shadow: 0 4px 24px rgba(59,130,246,0.4);
    }
    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }
    .logo p {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: #111827;
      border: 1px solid #2a3654;
      border-radius: 10px;
      color: #e8ecf4;
      font-size: 15px;
      transition: all 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .form-group input::placeholder {
      color: #475569;
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(59,130,246,0.4);
    }
    .login-btn:active {
      transform: translateY(0);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      min-height: 18px;
      transition: opacity 0.2s;
    }
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 11px;
      color: #475569;
    }
    .shake {
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>
  <div class="login-container" id="loginBox">
    <div class="logo">
      <div class="logo-icon">Z</div>
      <h1>ZHIHUI-DLT</h1>
      <p>大乐透多尺度状态融合智能筛选系统</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入账号" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="off" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
    <div class="footer">
      ZHIHUI-DLT v1.0 · 授权访问
    </div>
  </div>

  <script>
    (function() {
      const VALID_USER = 'zfk8888';
      const VALID_PASS = 'zfk96939093';
      const AUTH_KEY = 'zhihui_dlt_auth';

      // 已登录则直接跳转
      if (sessionStorage.getItem(AUTH_KEY) === '1') {
        window.location.replace('app.html');
        return;
      }

      const form = document.getElementById('loginForm');
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');
      const loginBox = document.getElementById('loginBox');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();

        btn.disabled = true;
        btn.textContent = '验证中...';
        errorMsg.textContent = '';

        setTimeout(function() {
          if (user === VALID_USER && pass === VALID_PASS) {
            sessionStorage.setItem(AUTH_KEY, '1');
            sessionStorage.setItem('zhihui_login_time', new Date().toISOString());
            btn.textContent = '登录成功';
            window.location.replace('app.html');
          } else {
            errorMsg.textContent = '账号或密码错误，请重试';
            loginBox.classList.add('shake');
            setTimeout(function() { loginBox.classList.remove('shake'); }, 400);
            btn.disabled = false;
            btn.textContent = '登 录';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
          }
        }, 500);
      });

      // 回车聚焦
      document.getElementById('username').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          document.getElementById('password').focus();
        }
      });
    })();
  </script>
</body>
</html>
